[project]
name = "gastroviewer"
version = "0.1.0"
description = "Standort-Datenterminal Deutschland — offene Daten zu einem Punkt auf der Karte"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Nur fuer den einmaligen Overture-Import noetig (zieht pyarrow mit) —
# der Server selbst kommt ohne aus.
overture = ["overturemaps>=0.8"]

[project.scripts]
gastroviewer = "gastroviewer.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gastroviewer*"]

[tool.setuptools.package-data]
gastroviewer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
