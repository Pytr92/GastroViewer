# Live-Probe der österreichischen Dienste (siehe scripts/at_probe.py).
# Nur per Handstart. Legt die Antworten als Fixtures auf dem Branch
# claude/at-probe ab — die Entwicklungsumgebung erreicht die Datenhosts nicht.

name: AT-Probe

on:
  workflow_dispatch:
    inputs:
      teile:
        description: "Teile (leer = alle): geocoder feiertage karte eurostat geosphere umwelt wien statistik sonstiges"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: httpx installieren
        run: python -m pip install --quiet httpx

      - name: Dienste abfragen
        run: python scripts/at_probe.py ${{ inputs.teile }}

      - name: Ergebnis auf Branch claude/at-probe ablegen
        run: |
          git config user.name "at-probe"
          git config user.email "at-probe@users.noreply.github.com"
          git checkout -B claude/at-probe
          git add -f fixtures/at
          git commit -m "AT-Probe: Live-Antworten vom $(date -u +%Y-%m-%d)" || echo "nichts zu committen"
          git push --force origin claude/at-probe
